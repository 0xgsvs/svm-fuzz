name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Solana platform tools
        run: |
          curl -sSfL https://release.anza.xyz/stable/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar -xj
          echo "$PWD/solana-release/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
